name: Build FANTIQ APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid android-actions/setup-android, which can fail while updating sdkmanager.
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found"; exit 1; }
          java -version
          node --version
          npm --version

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Copy APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk FANTIQ-demo-v1.apk
          ls -lh FANTIQ-demo-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FANTIQ-demo-APK
          path: FANTIQ-demo-v1.apk
          if-no-files-found: error
          retention-days: 30
